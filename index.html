<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="세계 각 나라의 랜드마크와 상징 색을 주파수로 표현한 인터랙티브 세계지도">
<meta name="theme-color" content="#0b0a0e">
<script>
  // Apply the saved theme (or the system one) before the first paint, so the page never flashes
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0a0e'/%3E%3Cg fill='%237aa7ff'%3E%3Crect x='5' y='13' width='3' height='6' rx='1.5'/%3E%3Crect x='10' y='8' width='3' height='16' rx='1.5'/%3E%3Crect x='15' y='4' width='3' height='24' rx='1.5'/%3E%3Crect x='20' y='9' width='3' height='14' rx='1.5'/%3E%3Crect x='25' y='12' width='3' height='8' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<title>Country Noise Map</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="ambient" aria-hidden="true"></canvas>
<div id="tint" aria-hidden="true"></div>

<div id="map" aria-label="세계지도">
  <p id="status">지도를 불러오는 중…</p>
</div>

<div id="tip" role="tooltip"></div>

<canvas id="wave" aria-hidden="true"></canvas>

<header id="caption" aria-live="polite">
  <p class="eyebrow" id="continent"></p>
  <h1 id="name"></h1>
  <p class="meta" id="sub"></p>
</header>

<button id="theme-toggle" class="theme-toggle" type="button" aria-label="라이트 모드로 전환" title="라이트 모드로 전환">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20.2 14.6A8.2 8.2 0 0 1 9.4 3.8a8.2 8.2 0 1 0 10.8 10.8z"/>
  </svg>
</button>

<p class="hint" id="hint">나라를 선택하세요</p>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;color:#8a8394">이 페이지는 JavaScript가 필요합니다.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="js/data/landmarks.js"></script>
<script src="js/data/palettes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
